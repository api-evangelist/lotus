description: 'Lotus (Lotus Health AI) is a consumer healthcare company delivering AI-driven medical
  care backed by real physicians through an iOS app. The service offers an AI Doctor that analyzes
  a member''s health, prescriptions sent to any U.S. pharmacy, lab orders across 6,000+ test sites,
  centralized medical-record storage, and 24/7 care. Founded by KJ Dhaliwal (CEO) and Zekka Nelson
  (CTO) with clinicians from UCLA Health, UCSF, and Johns Hopkins, and backed by CRV among others.
  As of this enrichment pass Lotus publishes no public developer/API surface: no developer portal,
  API documentation, OpenAPI, well-known discovery, or security.txt were found. Only an end-user
  Intercom help center and a careers page are public.'
